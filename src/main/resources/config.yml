# Menu opened by /sincemenu open when no menu id is supplied.
default-menu: sao_test_menu

# Fake packet entity ids start here to avoid colliding with normal server entities.
entity-id-start: 9000000

menu-defaults:
  # Used when a menu does not define its own permission.
  permission-pattern: "sincemenu.menu.{menu}"

  # Used when a menu does not define its own permission-message.
  permission-message: "<red>You do not have permission to open this menu."

  # Placeholder and item metadata refresh interval in ticks.
  refresh-rate: 20

  # Press the drop key once to freeze the menu at its current position; press it again to follow normally.
  # The drop packet is cancelled while a menu is open, so no item is dropped.
  drop-key-toggle-pin: true

  # A pure packet-only display cannot detect the Esc key because no vanilla gameplay packet is sent.
  # The swap-hand key is F by default on vanilla clients and is cancelled while a menu is open.
  close-on-swap-hand: true

  # Invisible Interaction entities are spawned behind every visual item so clicks are reliable.
  # Increase these values for larger, easier buttons; decrease them for tighter hitboxes.
  hitbox-width: 0.8
  hitbox-height: 0.6

  # How often SinceMenu checks whether a followed menu should move, in ticks.
  # A lower value feels more responsive; thresholds below prevent constant teleport spam.
  follow-rate: 2

  # The menu only moves after the viewer moves this many blocks from the last menu anchor.
  # Increase this if clicking feels unstable while walking.
  follow-distance-threshold: 0.35

  # The menu only moves after the viewer rotates this many degrees from the last menu anchor.
  # Increase this if clicking feels unstable while looking around.
  follow-angle-threshold: 12.0

  # When false, a standing player can look around without dragging open menu panels.
  # Movement still re-anchors the menu when follow-player is enabled.
  follow-rotation: false

  # If the menu is pinned and the viewer walks farther than this many blocks from it,
  # SinceMenu re-anchors the pinned menu in front of the viewer so it cannot be left behind.
  pinned-return-distance: 10.0

  # Mouse wheel and [scroll_up]/[scroll_down] move through this many visible scrollable items.
  # Set to 0 to render every item on the page without viewport clipping.
  scroll-visible-items: 6

  # The first scrollable item starts here, then each next visible item moves downward by the spacing below.
  scroll-start-y: 0.75
  scroll-item-spacing: 0.35

  # Each submenu layer is shifted left by this many blocks, matching the SAO-style cascading layout.
  submenu-shift-x: 1.35

  # Shows an item's lore beside the hovered item while the player looks at it.
  hover-lore: true
  hover-rate: 2
  hover-max-distance: 3.5
  lore-offset-x: 0.95
  lore-offset-y: 0.1
  lore-offset-z: 0.05
  lore-background-color: 0xAA001B2E

  # Display entity scale. Item displays must be much smaller than their default one-block size.
  item-scale: 0.28
  text-scale: 0.55
  lore-scale: 0.42

messages:
  # MiniMessage format is supported in all messages below.
  admin-help:
    - "<gray>/sincemenu open <menu> [player]"
    - "<gray>/sincemenu close"
    - "<gray>/sincemenu reload"
  reloaded: "<green>SinceMenu reloaded."
  no-permission: "<red>You do not have permission."
  players-only: "<red>Only players can open this menu."
  unknown-menu: "<red>Unknown menu: <white>{menu}"
  unknown-player: "<red>Unknown player: <white>{player}"
  menu-pinned: "<gray>Menu pinned."
  menu-unpinned: "<gray>Menu follow restored."

command-descriptions:
  # Description shown by the server command system for /sincemenu.
  admin: "SinceMenu administration command."

  # Description shown by the server command system for direct menu commands.
  # {menu} is replaced with the menu file id.
  menu: "Open menu {menu}."
